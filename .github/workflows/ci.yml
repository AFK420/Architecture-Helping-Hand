name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run full test suite
        run: npm test

      - name: Lint (zero-dependency static checks)
        run: npm run lint

      - name: Verify bundle freshness (build + --check)
        run: |
          npm run build
          node scripts/build.js --check
